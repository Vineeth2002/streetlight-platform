<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GVMC Field Engineer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;min-height:100vh;padding-bottom:80px}

/* TOP BAR */
.topbar{background:#00529c;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{font-size:20px}
.topbar-title{color:#fff;font-size:14px;font-weight:700}
.topbar-sub{color:rgba(255,255,255,0.7);font-size:10px;margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn-signout{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600}

/* ACCENT */
.gov-accent{height:3px;background:linear-gradient(90deg,#ff6600,#ff9933,#ff6600)}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#dde3ec;border-bottom:1px solid #dde3ec}
.stat-box{background:#fff;padding:12px 8px;text-align:center}
.stat-val{font-size:20px;font-weight:700;color:#00529c}
.stat-lbl{font-size:10px;color:#666;margin-top:2px}
.stat-val.red{color:#dc3545}
.stat-val.amber{color:#ff8800}
.stat-val.green{color:#198754}

/* SECTION */
.section{padding:12px 14px 4px}
.section-title{font-size:11px;font-weight:700;color:#00529c;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}

/* JOB CARDS */
.job-card{background:#fff;border:1px solid #dde3ec;border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.job-card.urgent{border-left:4px solid #dc3545}
.job-card.warning{border-left:4px solid #ff8800}
.job-card.normal{border-left:4px solid #00529c}
.job-card.resolved{border-left:4px solid #198754;opacity:0.7}

.job-header{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f2f5}
.job-pole{font-size:14px;font-weight:700;color:#1a1a2e}
.job-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px}
.badge-urgent{background:#fde8e8;color:#dc3545}
.badge-warning{background:#fff3e0;color:#ff8800}
.badge-normal{background:#e8f0fe;color:#00529c}
.badge-resolved{background:#e8f5e9;color:#198754}

.job-body{padding:10px 12px}
.job-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px}
.job-label{color:#666}
.job-value{font-weight:600;color:#333;text-align:right;max-width:60%}
.job-fault{font-size:13px;font-weight:700;color:#dc3545;margin-bottom:8px}

.job-actions{padding:8px 12px;background:#f8f9fa;border-top:1px solid #f0f2f5;display:flex;gap:8px}
.btn-action{flex:1;padding:9px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s}
.btn-start{background:#00529c;color:#fff}
.btn-start:active{background:#003d75}
.btn-resolve{background:#198754;color:#fff}
.btn-resolve:active{background:#146c43}
.btn-navigate{background:#fff;border:1px solid #dde3ec !important;color:#00529c;border:none}
.btn-navigate:active{background:#f0f2f5}
.btn-done{background:#e9ecef;color:#666;cursor:default}

/* LOADING */
.loading{text-align:center;padding:40px 20px;color:#666;font-size:13px}
.spinner{width:32px;height:32px;border:3px solid #dde3ec;border-top-color:#00529c;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* EMPTY */
.empty{text-align:center;padding:40px 20px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:700;color:#333;margin-bottom:6px}
.empty-sub{font-size:13px;color:#666}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde3ec;display:flex;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,0.08)}
.nav-item{flex:1;padding:10px 4px;text-align:center;cursor:pointer;transition:background 0.15s}
.nav-item.active{background:#f0f4ff}
.nav-icon{font-size:20px}
.nav-label{font-size:10px;color:#666;margin-top:2px}
.nav-item.active .nav-label{color:#00529c;font-weight:700}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:500px;padding:20px;max-height:80vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-close{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:#666}
textarea{width:100%;border:1px solid #ced4da;border-radius:6px;padding:10px;font-size:13px;resize:vertical;min-height:80px;outline:none;font-family:inherit}
textarea:focus{border-color:#00529c}
.btn-modal-submit{width:100%;background:#198754;border:none;border-radius:6px;padding:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.btn-modal-submit:active{background:#146c43}

/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity 0.3s;white-space:nowrap}
.toast.show{opacity:1}
</style>
<script src="/demo-data.js"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">👷</div>
    <div>
      <div class="topbar-title">Field Operations</div>
      <div class="topbar-sub" id="user-name-display">GVMC Streetlight</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn-signout" onclick="doLogout()">Sign Out</button>
  </div>
</div>
<div class="gov-accent"></div>

<div class="stats-bar">
  <div class="stat-box">
    <div class="stat-val red" id="stat-urgent">0</div>
    <div class="stat-lbl">🚨 Urgent</div>
  </div>
  <div class="stat-box">
    <div class="stat-val amber" id="stat-pending">0</div>
    <div class="stat-lbl">⏳ Pending</div>
  </div>
  <div class="stat-box">
    <div class="stat-val green" id="stat-done">0</div>
    <div class="stat-lbl">✅ Done Today</div>
  </div>
</div>

<div id="main-content">
  <div class="loading">
    <div class="spinner"></div>
    Loading your assignments...
  </div>
</div>

<!-- Resolve Modal -->
<div class="modal-overlay" id="resolve-modal">
  <div class="modal">
    <div class="modal-title">
      ✅ Mark as Resolved
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div style="font-size:13px;color:#666;margin-bottom:12px">
      Pole: <strong id="modal-pole-id"></strong>
    </div>
    <label style="font-size:12px;font-weight:600;color:#333;display:block;margin-bottom:6px">
      Resolution Notes <span style="color:#dc3545">*</span>
    </label>
    <textarea id="resolution-notes" placeholder="Describe what was done to fix this issue..."></textarea>
    <button class="btn-modal-submit" onclick="submitResolve()">✅ Confirm Resolved</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="showTab('jobs')">
    <div class="nav-icon">📋</div>
    <div class="nav-label">My Jobs</div>
  </div>
  <div class="nav-item" onclick="showTab('map')">
    <div class="nav-icon">🗺️</div>
    <div class="nav-label">Map</div>
  </div>
  <div class="nav-item" onclick="showTab('history')">
    <div class="nav-icon">📅</div>
    <div class="nav-label">History</div>
  </div>
  <div class="nav-item" onclick="showTab('profile')">
    <div class="nav-icon">👤</div>
    <div class="nav-label">Profile</div>
  </div>
</div>

<script>
// ─── AUTH GUARD ───────────────────────────────────────────────────────────────
const token = localStorage.getItem('sl_token');
const userStr = localStorage.getItem('sl_user');
if(!token || !userStr){
  window.location.href = '/login.html';
}
const CURRENT_USER = JSON.parse(userStr || '{}');
if(CURRENT_USER.role !== 'FIELD_ENGINEER' && CURRENT_USER.role !== 'SUPER_ADMIN'){
  window.location.href = '/index.html';
}

document.getElementById('user-name-display').textContent =
  CURRENT_USER.full_name || 'Field Engineer';

// ─── DEMO DATA (replace with real API when poles exist) ──────────────────────
const DEMO_JOBS = [
  {
    work_order_id: 1001,
    pole_number: 'VSP-N-00142',
    fault_category: 'DRIVER_FAULT',
    fault_description: 'LED driver board failure — pole not lighting',
    zone_name: 'North Zone',
    ward: 'Ward 7',
    road_name: 'Beach Road, Near RK Beach',
    ticket_status: 'ASSIGNED',
    reported_timestamp: new Date(Date.now() - 3*60*60*1000).toISOString(),
    sla_deadline: new Date(Date.now() + 20*60*60*1000).toISOString(),
    hours_open: 3.2,
    lat: 17.7199, lng: 83.3012,
  },
  {
    work_order_id: 1002,
    pole_number: 'VSP-N-00891',
    fault_category: 'CABLE_THEFT',
    fault_description: 'Copper cable stolen from pole base',
    zone_name: 'North Zone',
    ward: 'Ward 3',
    road_name: 'Kommadi Junction',
    ticket_status: 'PENDING',
    reported_timestamp: new Date(Date.now() - 52*60*60*1000).toISOString(),
    sla_deadline: new Date(Date.now() - 4*60*60*1000).toISOString(),
    hours_open: 52.1,
    lat: 17.7626, lng: 83.2900,
  },
  {
    work_order_id: 1003,
    pole_number: 'VSP-N-01234',
    fault_category: 'DAY_BURNING_FAULT',
    fault_description: 'Photocell failure — light ON during daytime',
    zone_name: 'North Zone',
    ward: 'Ward 11',
    road_name: 'Madhurawada Main Road',
    ticket_status: 'IN_PROGRESS',
    reported_timestamp: new Date(Date.now() - 8*60*60*1000).toISOString(),
    sla_deadline: new Date(Date.now() + 40*60*60*1000).toISOString(),
    hours_open: 8.0,
    lat: 17.7626, lng: 83.3200,
  },
];

const FAULT_LABELS = {
  'DRIVER_FAULT':'Driver Board Failure',
  'LINE_FAULT':'Cable Short Circuit',
  'DAY_BURNING_FAULT':'Day Burning (Photocell)',
  'PREDICTIVE_DEGRADATION':'PCB Degradation',
  'CABLE_THEFT':'Cable Theft',
  'CABINET_FAULT':'CCMS Box Failure',
  'PHYSICAL_DAMAGE':'Physical Damage',
  'MANUAL_REPORT':'Manual Report',
};

let jobs = [];
let currentResolveId = null;
let activeTab = 'jobs';

// ─── FETCH JOBS ───────────────────────────────────────────────────────────────
async function fetchJobs(){
  try {
    // Try real API first
    const res = await fetch('/api/v1/work-orders?limit=50', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if(data.ok && data.data && data.data.length > 0){
      jobs = data.data;
    } else {
      // Fall back to demo data
      jobs = DEMO_JOBS;
    }
  } catch(e) {
    jobs = DEMO_JOBS;
  }
  renderJobs();
  updateStats();
}

// ─── RENDER JOBS ──────────────────────────────────────────────────────────────
function renderJobs(){
  const active = jobs.filter(j => j.ticket_status !== 'RESOLVED' && j.ticket_status !== 'CANCELLED');
  const content = document.getElementById('main-content');

  if(!active.length){
    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">✅</div>
        <div class="empty-title">All jobs complete!</div>
        <div class="empty-sub">No pending work orders assigned to you.</div>
      </div>`;
    return;
  }

  content.innerHTML = `
    <div class="section">
      <div class="section-title">📋 My Assigned Jobs (${active.length})</div>
      ${active.map(job => renderJobCard(job)).join('')}
    </div>`;
}

function renderJobCard(job){
  const now = Date.now();
  const deadline = new Date(job.sla_deadline).getTime();
  const hoursLeft = (deadline - now) / 3600000;
  const isBreached = hoursLeft < 0;
  const isWarning = hoursLeft >= 0 && hoursLeft < 12;

  const cardClass = isBreached ? 'urgent' : isWarning ? 'warning' : 'normal';
  const badgeClass = isBreached ? 'badge-urgent' : isWarning ? 'badge-warning' : 'badge-normal';
  const badgeText = isBreached
    ? `🚨 ${Math.abs(hoursLeft).toFixed(0)}h OVERDUE`
    : isWarning
    ? `⚠ ${hoursLeft.toFixed(0)}h left`
    : `✓ ${hoursLeft.toFixed(0)}h left`;

  const statusActions = {
    'PENDING':     `<button class="btn-action btn-start" onclick="startJob(${job.work_order_id})">▶ Start Job</button>`,
    'ASSIGNED':    `<button class="btn-action btn-start" onclick="startJob(${job.work_order_id})">▶ Start Job</button>`,
    'IN_PROGRESS': `<button class="btn-action btn-resolve" onclick="openResolve(${job.work_order_id},'${job.pole_number}')">✅ Mark Resolved</button>`,
    'SLA_VIOLATED':`<button class="btn-action btn-resolve" onclick="openResolve(${job.work_order_id},'${job.pole_number}')">✅ Mark Resolved</button>`,
  };

  return `
    <div class="job-card ${cardClass}" id="job-${job.work_order_id}">
      <div class="job-header">
        <div class="job-pole">💡 ${job.pole_number}</div>
        <span class="job-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="job-body">
        <div class="job-fault">${FAULT_LABELS[job.fault_category] || job.fault_category}</div>
        <div class="job-row">
          <span class="job-label">📍 Location</span>
          <span class="job-value">${job.road_name || job.ward || '—'}</span>
        </div>
        <div class="job-row">
          <span class="job-label">🏙️ Zone / Ward</span>
          <span class="job-value">${job.zone_name || '—'} · ${job.ward || '—'}</span>
        </div>
        <div class="job-row">
          <span class="job-label">⏱️ Status</span>
          <span class="job-value" style="color:#00529c;font-weight:700">${job.ticket_status}</span>
        </div>
        ${job.fault_description ? `
        <div style="background:#f8f9fa;border-radius:6px;padding:8px 10px;font-size:11px;color:#555;margin-top:6px">
          📝 ${job.fault_description}
        </div>` : ''}
      </div>
      <div class="job-actions">
        <button class="btn-action btn-navigate" onclick="navigateTo(${job.lat||17.7199},${job.lng||83.2956})">
          🗺️ Navigate
        </button>
        ${statusActions[job.ticket_status] || '<button class="btn-action btn-done" disabled>✓ Done</button>'}
      </div>
    </div>`;
}

// ─── STATS ────────────────────────────────────────────────────────────────────
function updateStats(){
  const urgent  = jobs.filter(j => {
    const h = (new Date(j.sla_deadline) - Date.now()) / 3600000;
    return h < 0 && j.ticket_status !== 'RESOLVED';
  }).length;
  const pending = jobs.filter(j =>
    ['PENDING','ASSIGNED','IN_PROGRESS','SLA_VIOLATED'].includes(j.ticket_status)
  ).length;
  const done = jobs.filter(j => j.ticket_status === 'RESOLVED').length;

  document.getElementById('stat-urgent').textContent  = urgent;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-done').textContent    = done;
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
async function startJob(id){
  showToast('Starting job...');
  try {
    await fetch(`/api/v1/work-orders/${id}/status`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify({ ticket_status: 'IN_PROGRESS' }),
    });
  } catch(e){}

  const job = jobs.find(j => j.work_order_id === id);
  if(job){ job.ticket_status = 'IN_PROGRESS'; }
  renderJobs();
  showToast('✅ Job started — marked IN PROGRESS');
}

function openResolve(id, poleNumber){
  currentResolveId = id;
  document.getElementById('modal-pole-id').textContent = poleNumber;
  document.getElementById('resolution-notes').value = '';
  document.getElementById('resolve-modal').classList.add('show');
}

function closeModal(){
  document.getElementById('resolve-modal').classList.remove('show');
  currentResolveId = null;
}

async function submitResolve(){
  const notes = document.getElementById('resolution-notes').value.trim();
  if(!notes){
    showToast('⚠ Please enter resolution notes');
    return;
  }

  showToast('Submitting...');
  closeModal();

  try {
    await fetch(`/api/v1/work-orders/${currentResolveId}/status`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify({
        ticket_status: 'RESOLVED',
        resolution_notes: notes,
        resolved_timestamp: new Date().toISOString(),
      }),
    });
  } catch(e){}

  const job = jobs.find(j => j.work_order_id === currentResolveId);
  if(job){ job.ticket_status = 'RESOLVED'; }
  renderJobs();
  updateStats();
  showToast('✅ Job marked as RESOLVED!');
}

function navigateTo(lat, lng){
  const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  window.open(url, '_blank');
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function showTab(tab){
  activeTab = tab;
  document.querySelectorAll('.nav-item').forEach((el,i) => {
    el.classList.remove('active');
  });
  const tabs = ['jobs','map','history','profile'];
  const idx = tabs.indexOf(tab);
  document.querySelectorAll('.nav-item')[idx]?.classList.add('active');

  const content = document.getElementById('main-content');

  if(tab === 'jobs'){
    renderJobs();
  } else if(tab === 'map'){
    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🗺️</div>
        <div class="empty-title">Map View</div>
        <div class="empty-sub">Tap Navigate on any job card to open Google Maps with directions to the pole location.</div>
      </div>`;
  } else if(tab === 'history'){
    const resolved = jobs.filter(j => j.ticket_status === 'RESOLVED');
    if(!resolved.length){
      content.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📅</div>
          <div class="empty-title">No history yet</div>
          <div class="empty-sub">Resolved jobs will appear here.</div>
        </div>`;
    } else {
      content.innerHTML = `
        <div class="section">
          <div class="section-title">📅 Resolved Today (${resolved.length})</div>
          ${resolved.map(job => `
            <div class="job-card resolved normal">
              <div class="job-header">
                <div class="job-pole">💡 ${job.pole_number}</div>
                <span class="job-badge badge-resolved">✅ Resolved</span>
              </div>
              <div class="job-body">
                <div class="job-fault" style="color:#198754">${FAULT_LABELS[job.fault_category]||job.fault_category}</div>
                <div class="job-row"><span class="job-label">Zone</span><span class="job-value">${job.zone_name||'—'}</span></div>
              </div>
            </div>`).join('')}
        </div>`;
    }
  } else if(tab === 'profile'){
    content.innerHTML = `
      <div class="section" style="padding-top:20px">
        <div style="background:#fff;border:1px solid #dde3ec;border-radius:10px;padding:20px;text-align:center;margin-bottom:12px">
          <div style="font-size:48px;margin-bottom:10px">👷</div>
          <div style="font-size:18px;font-weight:700;color:#1a1a2e">${CURRENT_USER.full_name||'Field Engineer'}</div>
          <div style="font-size:12px;color:#666;margin-top:4px">${CURRENT_USER.email||''}</div>
          <div style="display:inline-block;background:#e8f0fe;color:#00529c;padding:4px 12px;border-radius:10px;font-size:11px;font-weight:700;margin-top:8px">FIELD ENGINEER</div>
        </div>
        <div style="background:#fff;border:1px solid #dde3ec;border-radius:10px;overflow:hidden">
          <div style="padding:12px 16px;border-bottom:1px solid #f0f2f5;display:flex;justify-content:space-between;font-size:13px">
            <span style="color:#666">Jobs Today</span>
            <strong>${jobs.length}</strong>
          </div>
          <div style="padding:12px 16px;border-bottom:1px solid #f0f2f5;display:flex;justify-content:space-between;font-size:13px">
            <span style="color:#666">Resolved</span>
            <strong style="color:#198754">${jobs.filter(j=>j.ticket_status==='RESOLVED').length}</strong>
          </div>
          <div style="padding:12px 16px;display:flex;justify-content:space-between;font-size:13px">
            <span style="color:#666">Pending</span>
            <strong style="color:#ff8800">${jobs.filter(j=>j.ticket_status!=='RESOLVED').length}</strong>
          </div>
        </div>
        <button onclick="doLogout()" style="width:100%;margin-top:16px;background:#dc3545;border:none;border-radius:8px;padding:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer">
          Sign Out
        </button>
      </div>`;
  }
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── LOGOUT ───────────────────────────────────────────────────────────────────
function doLogout(){
  const refresh = localStorage.getItem('sl_refresh');
  fetch('/api/v1/auth/logout',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({refresh_token:refresh}),
  }).finally(()=>{
    localStorage.clear();
    window.location.href='/login.html';
  });
}
